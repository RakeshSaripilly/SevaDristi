apiVersion: v1
kind: ConfigMap
metadata:
  name: sevadristi-config
  namespace: sevadristi
  labels:
    app: sevadristi
data:
  DEMO_MODE: "false"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_PER_MINUTE: "60"
  MAX_UPLOAD_SIZE_BYTES: "10485760"
  WEB_CONCURRENCY: "4"
  HOST: "0.0.0.0"
  PORT: "8000"
  DATABASE_URL: "postgresql+asyncpg://sevadristi_user:sevadristi_password@sevadristi-postgres:5432/sevadristi_audit"
  REDIS_URL: "redis://sevadristi-redis:6379/0"
