apiVersion: v1
kind: Service
metadata:
  name: sevadristi-backend
  namespace: sevadristi
  labels:
    app: sevadristi
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: sevadristi
    tier: backend
---
apiVersion: v1
kind: Service
metadata:
  name: sevadristi-frontend
  namespace: sevadristi
  labels:
    app: sevadristi
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: sevadristi
    tier: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: sevadristi-postgres
  namespace: sevadristi
  labels:
    app: sevadristi
    tier: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: sevadristi
    tier: database
---
apiVersion: v1
kind: Service
metadata:
  name: sevadristi-redis
  namespace: sevadristi
  labels:
    app: sevadristi
    tier: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: sevadristi
    tier: cache
