<!doctype html>
<html lang="te">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="SevaDristi — Multilingual, Offline-Capable Document Pre-Verification Assistant for Telangana MeeSeva & CSC Service Centres." />
    <link rel="manifest" href="/manifest.json" />
    <title>SevaDristi — Document Pre-Verification Assistant</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
