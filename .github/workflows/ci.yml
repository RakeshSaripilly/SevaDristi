name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR + Tel/Hin)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tel tesseract-ocr-hin libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Linter (Flake8)
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Validate Government Scheme Rules Catalog
        run: |
          python -m backend.scripts.validate_rules

      - name: Run Backend Pytest Suite with Coverage (>80%)
        run: |
          python -m pytest backend/tests -v --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=80
        env:
          DEMO_MODE: "true"
          SEVADRISTI_QR_SECRET: "ci_test_secret_key_892347109283741092837410928374109283741092837410"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Validate Build
        run: |
          cd frontend
          npm ci
          npm run build
          npm run lint

  docker-and-security-scan:
    name: Build & Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: sevadristi-backend:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sevadristi-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: sevadristi-frontend:${{ github.sha }}

      - name: Kubernetes Dry-Run Manifest Validation
        run: |
          kubectl apply --dry-run=client -f k8s/
